<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fundo escuro para o ícone aparecer em abas claras e escuras -->
  <rect width="64" height="64" rx="14" fill="#0b0d10"/>
  <g transform="translate(32 32)">
    <!-- Metade de trás do anel -->
    <path d="M -27 0 A 27 8 0 0 1 27 0" transform="rotate(-45)" fill="none" stroke="#5ad1ec" stroke-width="4" stroke-linecap="round"/>
    <!-- Letra "o" -->
    <circle r="13" fill="none" stroke="#ffffff" stroke-width="7"/>
    <!-- Metade da frente do anel -->
    <path d="M -27 0 A 27 8 0 0 0 27 0" transform="rotate(-45)" fill="none" stroke="#5ad1ec" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
